schema: spec-driven

context: |
  Python FastAPI and self-hosted Dagster share a cluster per environment.
  No bot database, persistent work store, or distributed coordination service.
  One pod/process; bounded memory; Dagster GraphQL supplies run evidence.
  Every boot disarms mutations until operator reconciliation; no blind mutation retries.
  Build shared services and DEV-only mock/live workbench first; Slack is a separate adapter.
  Slack may be disabled for development; production exposes no DEV UI or mock routes.
  Preserve trusted failure threads, current authorization, requester confirmation,
  original inputs/latest code, Dagster retries and one admitted bot-created family.
  Audit baseline: Dagster 1.13.1, private HTTP port 80, cross-namespace policy gate.
  One workspace, allowlisted channels, one PROD code location; isolated DEV.
  No LLM in phase one. Implementation and environment release checks remain pending.

rules:
  tasks:
    - Include verification per task; check it only after implementation and evidence pass.
